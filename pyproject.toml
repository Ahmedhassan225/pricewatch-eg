[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pricewatch-eg"
version = "0.1.0"
description = "Local price tracker for Egyptian online stores with flash-sale alerts and a buy-now dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "rapidfuzz>=3.9",
  "jinja2>=3.1",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "playwright>=1.47",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
pricewatch = "pricewatch.cli:main"

[tool.setuptools.packages.find]
include = ["pricewatch*"]

[tool.setuptools.package-data]
pricewatch = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"pricewatch/scraping/vendors.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
